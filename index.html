<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#17232f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Seat" />
    <meta name="description" content="Musical chairs on the commuter train. Rebutan kursi di kereta komuter." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Don't Take My Seat</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" tabindex="-1"></canvas>

      <!-- In-game HUD -->
      <div id="hud" hidden>
        <div id="roster">
          <button id="rosterMini" type="button"><span class="mdots"></span><span class="mpts"></span><kbd>Tab</kbd></button>
          <div id="rosterFull"></div>
        </div>
        <div id="board">
          <div id="boardLabel"></div>
          <div id="boardStation"></div>
          <div id="boardChallenge"></div>
          <div id="timer"><div id="timerFill"></div></div>
          <div id="seatsLeft"></div>
          </div>
        <div id="topRight">
          <div class="icon-btn" id="hudPing" role="status" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path class="a3" d="M2.5 9.2a14 14 0 0 1 19 0"/><path class="a2" d="M5.8 12.6a9.3 9.3 0 0 1 12.4 0"/><path class="a1" d="M9.1 16a4.6 4.6 0 0 1 5.8 0"/><circle class="a0" cx="12" cy="19.3" r="1.6"/></svg>
            <span id="hudPingMs"></span>
          </div>
          <button class="icon-btn" id="hudPause" aria-label="Pause">
            <svg viewBox="0 0 24 24" width="20" height="20"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </button>
        </div>
        <div id="banner"></div>
        <div id="labels"></div>
        <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
        <button id="itemBtn" class="hidden" type="button"><span id="itemIcon"></span><kbd>E</kbd></button>
        <button id="actionBtn"><span id="actionLabel"></span><svg id="actionRing" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg></button>
      </div>

      <!-- Menus -->
      <section class="screen" id="menu">
        <button class="btn shop-btn" id="btnShop"><svg class="shop-logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 15v-3a7 7 0 0 1 14 0v3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><rect x="7" y="14" width="34" height="29" rx="7" fill="#ffc02e"/><rect x="7" y="14" width="34" height="8" rx="4" fill="#f28a2e"/><path d="M17 37v-7h14v7M15 30h18" stroke="#24272c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="shop"></span><span class="coin-pill small" id="menuCoins"></span></button>
        <div class="menu-card">
          <h1><span>Don't Take</span><span class="accent">My Seat</span></h1>
          <p class="tagline" data-t="tagline"></p>
          <p class="error" id="menuNotice" role="alert"></p>
          <button class="btn primary rejoin" id="btnRejoin" hidden></button>
          <button class="btn primary" id="btnPlay" data-t="playBots"></button>
          <div class="row">
            <button class="btn" id="btnCreate" data-t="createRoom"></button>
            <button class="btn" id="btnJoin" data-t="joinRoom"></button>
          </div>
          <div class="row">
            <button class="btn subtle" id="btnHowTo" data-t="howTo"></button>
            <button class="btn subtle" id="btnSettings" data-t="settings"></button>
          </div>
          <button class="btn subtle" id="btnBoard" data-t="leaderboard" hidden></button>
          <button class="btn subtle install" id="btnInstall" data-t="installApp" hidden></button>
          <p class="tagline install-hint" id="iosInstallHint" data-t="installIos" hidden></p>
        </div>
      </section>

      <section class="screen dim" id="settingsScreen" hidden>
        <div class="menu-card wide">
          <h2 data-t="settings"></h2>
          <div class="settings">
            <label class="setting" for="inpName"><span data-t="yourName"></span>
              <input id="inpName" maxlength="14" autocomplete="nickname" />
            </label>
            <h3 class="settings-group" data-t="controls"></h3>
            <div class="setting"><span data-t="sensitivity"></span>
              <div class="slider">
                <span class="hint" data-t="sensCalm"></span>
                <input type="range" id="inpSens" min="1" max="5" step="1" />
                <span class="hint" data-t="sensQuick"></span>
              </div>
            </div>
            <div class="setting"><span data-t="ctlSize"></span>
              <div class="seg" id="segCtlSize"><button data-v="s" data-t="sizeS"></button><button data-v="m" data-t="sizeM"></button><button data-v="l" data-t="sizeL"></button></div>
            </div>
            <div class="setting"><span data-t="ctlSide"></span>
              <div class="seg" id="segCtlSide"><button data-v="left" data-t="stickLeft"></button><button data-v="right" data-t="stickRight"></button></div>
            </div>
            <div class="setting"><span data-t="ctlMode"></span>
              <div class="seg" id="segCtlMode"><button data-v="floating" data-t="stickFloating"></button><button data-v="fixed" data-t="stickFixed"></button></div>
            </div>
            <div class="setting" id="rowVibrate"><span data-t="vibrate"></span>
              <div class="seg" id="segVibrate"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div>
            </div>
            <p class="hint keys-hint" data-t="keysHint"></p>
            <h3 class="settings-group" data-t="general"></h3>
            <div class="setting"><span data-t="difficulty"></span>
              <div class="seg" id="segDifficulty"><button data-v="easy" data-t="easy"></button><button data-v="normal" data-t="normal"></button></div>
            </div>
            <div class="setting"><span data-t="language"></span>
              <div class="seg" id="segLang"><button data-v="en">EN</button><button data-v="id">ID</button></div>
            </div>
            <div class="setting"><span data-t="tipsSetting"></span>
              <div class="seg" id="segTips"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div>
            </div>
            <div class="setting"><span data-t="shopItemsSetting"></span>
              <div class="seg" id="segShopItems"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div>
            </div>
            <div class="setting"><span data-t="sound"></span>
              <div class="seg" id="segSound"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div>
            </div>
          </div>
          <button class="btn subtle" id="btnTipsReset" data-t="showTipsAgain"></button>
          <button class="btn primary" id="btnSettingsClose" data-t="close"></button>
        </div>
      </section>

      <section class="screen dim" id="joinScreen" hidden>
        <form class="menu-card wide" id="joinForm" novalidate>
          <h2 data-t="joinRoom"></h2>
          <p class="tagline" data-t="enterCode"></p>
          <input id="inpCode" class="code-input" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC23" />
          <label class="name-field" for="inpJoinName"><span data-t="yourName"></span>
            <input id="inpJoinName" class="name-input" maxlength="14" autocomplete="nickname" />
          </label>
          <p class="error" id="joinError" role="alert"></p>
          <div class="row">
            <button type="button" class="btn" id="btnJoinBack" data-t="back"></button>
            <button type="submit" class="btn primary" id="btnJoinGo" data-t="join"></button>
          </div>
        </form>
      </section>

      <section class="screen dim" id="lobby" hidden>
        <div class="menu-card wide lobby-card">
          <p class="lobby-note" id="lobbyNote" role="status" hidden></p>
          <div class="lobby-head">
            <div id="lobbyCodeBox">
              <div class="eyebrow" data-t="roomCode"></div>
              <div class="code-row"><span id="lobbyCode"></span><button class="btn small" id="btnCopy" data-t="copy"></button></div>
              <p class="tagline" data-t="shareCode"></p>
            </div>
            <h2 id="lobbyTitle"></h2>
          </div>
          <ul id="lobbyList"></ul>
          <label class="name-field" for="inpLobbyName"><span data-t="yourName"></span>
            <input id="inpLobbyName" class="name-input" maxlength="14" autocomplete="nickname" />
          </label>
          <p class="tagline" id="lobbyStatus"></p>
          <p class="error" id="lobbyError" role="alert"></p>
          <div class="row">
            <button class="btn" id="btnLobbyLeave" data-t="leave"></button>
            <button class="btn primary" id="btnLobbyStart" data-t="start"></button>
          </div>
        </div>
      </section>

      <section class="screen" id="howto" hidden>
        <div class="menu-card wide">
          <h2 data-t="howTo"></h2>
          <ol id="rulesList"></ol>
          <div class="legend">
            <span><i class="sw free"></i><span data-t="legendFree"></span></span>
            <span><i class="sw seat"></i><span data-t="legendSeat"></span></span>
            <span><i class="sw prio"></i><span data-t="legendPriority"></span></span>
          </div>
          <button class="btn primary" id="btnHowToClose" data-t="close"></button>
        </div>
      </section>

      <section class="screen dim" id="shopScreen" hidden>
        <div class="menu-card wide shop-card">
          <header class="shop-head">
            <svg class="shop-logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 15v-3a7 7 0 0 1 14 0v3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><rect x="7" y="14" width="34" height="29" rx="7" fill="#ffc02e"/><rect x="7" y="14" width="34" height="8" rx="4" fill="#f28a2e"/><path d="M17 37v-7h14v7M15 30h18" stroke="#24272c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h2 data-t="shopTitle"></h2>
            <span class="coin-pill" id="shopCoins"></span>
            <button class="icon-btn shop-x" id="btnShopClose" type="button" aria-label="Close">✕</button>
          </header>
          <div class="shop-body">
            <div class="shop-preview"><canvas id="shopPreview"></canvas></div>
            <div class="shop-main">
              <div class="seg shop-tabs" id="shopTabs"><button data-v="acc" data-t="tabAccessories"></button><button data-v="items" data-t="tabItems"></button></div>
              <div class="shop-slots" id="shopSlots"></div>
              <p class="shop-hint" id="shopHint"></p>
              <ul class="shop-grid" id="shopGrid"></ul>
            </div>
          </div>
        </div>
      </section>

      <section class="screen" id="boardScreen" hidden>
        <div class="menu-card wide">
          <h2 data-t="leaderboard"></h2>
          <p class="tagline" id="boardInfo"></p>
          <ol id="boardList"></ol>
          <p class="board-me" id="boardMe" hidden></p>
          <button class="btn primary" id="btnBoardClose" data-t="close"></button>
        </div>
      </section>

      <section class="screen dim" id="pause" hidden>
        <div class="menu-card">
          <h2 data-t="paused"></h2>
          <button class="btn primary" id="btnResume" data-t="resume"></button>
          <div class="settings">
            <div class="setting"><span data-t="sensitivity"></span>
              <div class="slider"><input type="range" id="inpSens2" min="1" max="5" step="1" /></div>
            </div>
            <div class="setting"><span data-t="sound"></span>
              <div class="seg" id="segSound2"><button data-v="on" data-t="on"></button><button data-v="off" data-t="off"></button></div>
            </div>
          </div>
          <button class="btn" id="btnQuit" data-t="quit"></button>
        </div>
      </section>

      <section class="screen dim" id="gameover" hidden>
        <div class="menu-card over-card">
          <p class="over-kicker" id="overPlace"></p>
          <h2 id="overTitle"></h2>
          <ol id="standings"></ol>
          <p class="over-coins" id="overCoins" hidden></p>
          <p class="board-me" id="overRank" hidden></p>
          <p class="tagline" id="overWait" hidden></p>
          <div class="row over-actions">
            <button class="btn" id="btnMenu" data-t="leave"></button>
            <button class="btn primary" id="btnAgain" data-t="continueGame"></button>
          </div>
        </div>
      </section>

      <div id="netNotice" role="status" hidden></div>

      <section id="rotate">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M50 40 a18 18 0 0 1 -14 14" fill="none" stroke="currentColor" stroke-width="3"/><path d="M36 50 l0 5 l5 -1" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        <p data-t="rotate"></p>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
