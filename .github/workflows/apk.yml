# Builds an installable Android APK in the cloud and attaches it to the
# "apk-latest" release, so it can be downloaded straight from a phone.
#
# Optional secret DEBUG_KEYSTORE_B64 (base64 of a debug keystore): when set,
# every build is signed with the same key, so new builds install over old
# ones. Without it each build gets a fresh key and the old app must be
# uninstalled first.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Use the shared signing key
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=dont-take-my-seat.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest "$APK" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest test build" \
            --notes "Built from ${GITHUB_SHA::7}. Download the APK on your Android phone and open it to install."

      - uses: actions/upload-artifact@v4
        with:
          name: dont-take-my-seat-apk
          path: dont-take-my-seat.apk
          retention-days: 14
