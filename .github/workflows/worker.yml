# Deploys the Cloudflare Worker (room signaling over WebSocket on port 443 +
# Cloudflare TURN credentials). Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   TURN_KEY_ID            Realtime → TURN key: "Turn Token ID"
#   TURN_KEY_API_TOKEN     Realtime → TURN key: "API Token"
# Without CLOUDFLARE_API_TOKEN the job is skipped.
name: Worker (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the Worker deploy (see worker/README.md)."
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run typecheck
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: **$url** — put it in the repository variable \`SIGNAL_URL\` and re-run *Web (GitHub Pages)*." >> "$GITHUB_STEP_SUMMARY"
      - name: TURN secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          if [ -z "$TURN_KEY_ID" ] || [ -z "$TURN_KEY_API_TOKEN" ]; then
            echo "::warning::TURN_KEY_ID / TURN_KEY_API_TOKEN not set; the Worker hands out STUN only."
            exit 0
          fi
          node -e 'console.log(JSON.stringify({TURN_KEY_ID:process.env.TURN_KEY_ID,TURN_KEY_API_TOKEN:process.env.TURN_KEY_API_TOKEN}))' > secrets.json
          npx wrangler secret bulk secrets.json
          rm secrets.json
      - name: Check
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          curl -fsS "$url/"
          echo
          curl -fsS -H 'Origin: https://whiskey34.github.io' "$url/scores" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("Leaderboard OK, players:",j.total)})'
          curl -fsS -H 'Origin: https://whiskey34.github.io' "$url/turn" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log("TURN enabled:",j.turn,"servers:",j.iceServers.flatMap(x=>[].concat(x.urls)).join(" "))})'
